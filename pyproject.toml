[project]
name = "second-brain"
version = "0.1.0"
description = "Visual Second Brain daily dashboard backend"
readme = "README.md"
authors = [
    { name = "Minh Le", email = "lehnminh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "uvicorn>=0.54.0",
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
]

[project.scripts]
second-brain = "second_brain:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"
source-include = ["frontend/dashboard.py"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py314"
src = ["backend"]

[tool.vercel]
entrypoint = "backend.app:app"
